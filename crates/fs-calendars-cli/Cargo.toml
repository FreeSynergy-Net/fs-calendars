[package]
name = "fs-calendars-cli"
description = "Command line of FreeSynergy calendar: a second user of events.capnp, next to the MCP tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "fs_calendars_cli"

[dependencies]
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.11", features = ["rpc"] }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
capnp = "0.27"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
fs-calendars-core = { path = "../fs-calendars-core" }
fs-calendars-server = { path = "../fs-calendars-server" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
