[package]
name = "fs-calendars-simple"
description = "The standard frontend `simple` of FreeSynergy Calendars: a window on fs-components with month, week, day and agenda views"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# fs-components needs 1.89 (the other crates of the workspace keep the lower minimum).
rust-version = "1.89"

[lib]
name = "fs_calendars_simple"

# The process the starter `fs-calendars` runs (ADR 0094 draft, item 6): never started by a person directly.
[[bin]]
name = "fs-calendars-simple"
path = "src/main.rs"

[dependencies]
# One tag of fs-components for everything; Blinc comes only through it (`fs_components::blinc`), never as a dependency here.
# v0.0.24 on purpose: the one tag whose `fs-types` comes from the same source as the core of this workspace (fs-interfaces v0.0.22).
fs-components = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.24" }
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.24" }
fs-components-fields = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.24" }
fs-components-widgets = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.24" }
fs-components-mf2 = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.24" }
fs-components-words = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.24" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
base64 = "0.22"
