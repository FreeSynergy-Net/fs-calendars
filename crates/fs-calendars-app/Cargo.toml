[package]
name = "fs-calendars-app"
description = "The calendar program of FreeSynergy: the generated admin window over the Event description (ADR 0066), in the window shell (ADR 0065)"
version = "0.0.4"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["FreeSynergy <support@freesynergy.net>"]
repository = "https://github.com/FreeSynergy/fs-calendars"

# Outside the main workspace until the port (DESIGN.md, "Admin window"): own root, own Cargo.lock, old fs-components pin.
[workspace]

[dependencies]
fs-calendars-core = { path = "../fs-calendars-core" }
# The task program behind the calendar's two small traits; `local`: the task store is in this process.
fs-calendars-tasks = { path = "../fs-calendars-tasks", features = ["local"] }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
# Tasks belong to fs-tasks (ADR 0050); shown through the TaskItems interface. Tag-pinned on purpose.
fs-tasks-core = { git = "https://github.com/FreeSynergy/fs-tasks", tag = "v0.0.1" }
fs-types = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.22" }
# TEMPORARY (DESIGN.md, "Temporary duplication"): the types the shipped admin frontend takes; see src/frontend_types.rs.
fs-types-frontend = { package = "fs-types", git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.2" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.22", features = ["rpc"] }
# One commit of branch thread-a-admin-frontend, untagged (DESIGN.md, "Pins"); all fs-components crates from the same commit.
fs-admin-frontend = { git = "https://github.com/FreeSynergy/fs-components", rev = "9950b51" }
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", rev = "9950b51" }
fs-components-fields = { git = "https://github.com/FreeSynergy/fs-components", rev = "9950b51" }
fs-components-widgets = { git = "https://github.com/FreeSynergy/fs-components", rev = "9950b51" }
fs-components-calendar-grid = { git = "https://github.com/FreeSynergy/fs-components", rev = "9950b51" }
fs-components-styles = { git = "https://github.com/FreeSynergy/fs-components", rev = "9950b51" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
tempfile = "3"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }

# Window resize crash (wgpu validation error when the window is enlarged): compositor cache sized by the window,
# not by the target texture. Pinned to a commit (coding.md section 8).
[patch.crates-io]
blinc_app = { git = "https://github.com/FreeSynergy/blinc-app-fix", rev = "5180d4eae80034d851d98464861f098d69eceaf0" }
# Restyle only the nodes an incremental update replaced (blinc-layout-fix, same change as Blinc pull request 71).
blinc_layout = { git = "https://github.com/FreeSynergy/blinc-layout-fix", rev = "cb17db8111f2037473e6e02b6784628ca0dca151" }
