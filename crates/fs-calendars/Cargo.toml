[package]
name = "fs-calendars"
description = "FreeSynergy.Calendars: one program, one command (ADR 0063): the window, `serve`, and the command line"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "fs-calendars"
path = "src/main.rs"

[dependencies]
fs-calendars-server = { path = "../fs-calendars-server" }
fs-calendars-cli = { path = "../fs-calendars-cli" }

[dev-dependencies]
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.27" }
fs-rpc = { git = "https://github.com/FreeSynergy/fs-rpc", tag = "v0.0.2" }
tokio = { version = "1", features = ["full"] }
tempfile = "3"

# The frontend `simple` is a package of its own (one deb/rpm per Cargo package, ADR 0094 draft): the program needs it.
# Both binaries are never in ONE deb (file conflict with the deb of fs-calendars-simple).
[package.metadata.deb]
name = "fs-calendars"
# cargo-deb replaces only `$auto` in `depends`; so a fixed lower bound, not `${binary:Version}`.
depends = "$auto, fs-calendars-simple (>= 0.0.5)"

# A package with its own generate-rpm table lists its assets itself (fs-release scripts/linux-pkg.sh).
[package.metadata.generate-rpm]
name = "fs-calendars"
assets = [{ source = "target/release/fs-calendars", dest = "/usr/bin/fs-calendars", mode = "755" }]
[package.metadata.generate-rpm.requires]
fs-calendars-simple = ">= 0.0.5"
