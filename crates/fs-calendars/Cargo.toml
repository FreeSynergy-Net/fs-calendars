[package]
name = "fs-calendars"
description = "FreeSynergy.Calendars: one program, one command (ADR 0063): the window, `serve`, and the command line"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "fs-calendars"
path = "src/main.rs"

[dependencies]
fs-calendars-server = { path = "../fs-calendars-server" }
fs-calendars-cli = { path = "../fs-calendars-cli" }

[dev-dependencies]
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.22", features = ["rpc"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
