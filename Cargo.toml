[workspace]
resolver = "2"
# Until the port, see DESIGN.md "Admin window": the app has its own Cargo.lock and old fs-components pin.
exclude = ["crates/fs-calendars-app"]
members = ["crates/fs-calendars-core", "crates/fs-calendars-server", "crates/fs-calendars-tasks", "crates/fs-calendars-cli", "crates/fs-calendars", "crates/fs-calendars-testdata", "crates/fs-calendars-local", "crates/fs-calendars-simple"]

[workspace.package]
authors = ["FreeSynergy <support@freesynergy.net>"]
repository = "https://github.com/FreeSynergy/fs-calendars"
version = "0.0.4"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
