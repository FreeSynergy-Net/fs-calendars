name: release
# Release of FreeSynergy Calendars on a version tag (fs-release caller, pinned). The window is back with v0.0.5: the tag trigger is on again.
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write
jobs:
  release:
    uses: FreeSynergy/fs-release/.github/workflows/release.yml@v0.0.15
    with:
      # `fs-calendars` holds the server (`fs-calendars serve`), the command line and the starter; `fs-calendars-simple` is the frontend process.
      binaries: fs-calendars,fs-calendars-simple
      cargo-package: fs-calendars
      name: fs-calendars
      kind: app
      app-id: net.freesynergy.Calendars
      macos: false
      windows-targets: ""   # Unix sockets and Unix paths for now
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
