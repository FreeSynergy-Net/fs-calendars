name: release
# No calendar release until the window is ported (DESIGN.md "Admin window", see A): the tag trigger is off, the job
# runs only by hand. Restore `push: { tags: ["v*"] }` with the port.
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write
jobs:
  release:
    uses: FreeSynergy/fs-release/.github/workflows/release.yml@main
    with:
      binaries: fs-calendars
      cargo-package: fs-calendars
      name: fs-calendars
      kind: app
      app-id: net.freesynergy.Calendars
      macos: false
      windows-targets: ""   # Unix sockets and Unix paths for now
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
